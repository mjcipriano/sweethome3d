<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sweet Home 3D - WebXR Preview</title>
  <style>
    body { margin:0; overflow:hidden; background:#9fc4e8; color:#e8f5ff; font-family:Arial,sans-serif; }
    #overlay { position:fixed; top:10px; left:10px; background:rgba(0,0,0,0.7); padding:10px 12px; border-radius:6px; max-width:420px; line-height:1.45; font-size:13px; }
    #overlay table { border-collapse:collapse; margin-top:6px; }
    #overlay td { padding:1px 10px 1px 0; vertical-align:top; }
    #overlay td:first-child { color:#a7d7ff; white-space:nowrap; }
    #status { margin-top:6px; font-weight:bold; }
    #log { margin-top:4px; white-space:pre-wrap; font-size:12px; color:#ffd0d0; }
    canvas { display:block; }
  </style>
</head>
<body>
<div id="overlay">
  <div><strong>Sweet Home 3D - walk through your home</strong></div>
  <div>Press <em>Enter VR</em> in a headset, or explore here:</div>
  <table>
    <tr><td>W A S D / arrows</td><td>walk (Shift to run)</td></tr>
    <tr><td>Drag the mouse</td><td>look around</td></tr>
    <tr><td>Q / E</td><td>turn</td></tr>
    <tr><td>Page Up / Down</td><td>go to the level above / below</td></tr>
    <tr><td>C</td><td>walls block you: on / off</td></tr>
    <tr><td>R</td><td>back to the start</td></tr>
  </table>
  <div id="status">Loading...</div>
  <div id="log"></div>
</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
} }
</script>
<script type="module" src="webxr-viewer.js"></script>
</body>
</html>
