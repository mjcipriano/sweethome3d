# The pieces of the furniture catalog that show a species when a plant is asked with "model":"catalog":
# the first name the catalog has is used. catalog.<FORM> for pines and other conifers, catalog.small for
# the trees under 9 m, catalog.narrow for the tall and narrow ones, catalog.shrub, catalog.palm,
# catalog.default for the others, and catalog.species.<name> for one species.
catalog.PINE     = Pine/Ponderosa/Pine tree/Fir tree
catalog.CONICAL  = Fir tree/Spruce/Fir/Ponderosa/Pine
catalog.COLUMNAR = Cypress/Poplar/Pine
catalog.small    = BirchTree/Birch/Small tree/Sycamore maple
catalog.narrow   = Poplar/Sycamore maple
catalog.shrub    = Bush/Shrub/Hydrangea
catalog.palm     = Palm tree/Palm
catalog.default  = Sycamore maple/Oak/Maple/Tree/Big tree
catalog.species.tulip_poplar = Poplar
catalog.species.river_birch  = BirchTree/Birch
