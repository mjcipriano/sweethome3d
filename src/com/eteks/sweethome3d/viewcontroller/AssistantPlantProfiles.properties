# How the generated trees and shrubs grow: read by AssistantTreeBuilder.
#
# Each line gives values to a form of crown (form.<FORM>), to the species whose name contains
# a word (match.<word>) or to one species (species.<name>). They are read in that order, the
# last one wins, and the "profile" of a command (add_tree...) wins over this file.
#
#   excurrent    1 for a trunk that goes up to the top with branches around it, 0 for a trunk that divides
#   trunk_top    where a trunk that divides ends, as a share of the height of the crown
#   shell        how much the ends of the branches go to the outside of the crown (1 fills it evenly)
#   irregularity how far the outline of the crown goes in and out of its measured shape (share of its radius)
#   gaps         how many holes the crown has (share of its volume)
#   clumps       for a crown made of separate masses, their count (0 for one mass)
#   up           how much the branches turn upward as they grow
#   droop        how much they hang, more as they go away from the trunk
#   pipe         exponent of the rule that gives the thickness of a limb from the ones it carries (2 to 3)
#   leaf         picture of the clusters: ovate lance lobed palmate round broad small compound tuft spray scale
#   card         size of a cluster of leaves, as a share of the radius of the crown
#   lift         how much the clusters point up rather than outward
#   along        1 to put clusters along the branches and not only at their ends
#   density      multiplies the count of branch ends and of clusters
#   bark         bark bark_plated bark_furrowed bark_birch bark_smooth
#   marcescent   share of the dead leaves a deciduous tree keeps in winter
#   autumn       more colors of the leaves in autumn, as hex numbers separated by /

form.ROUND      = excurrent:0 trunk_top:0.14 shell:3 irregularity:0.16 gaps:0.16 up:0.12 droop:0.04 leaf:ovate card:0.29 lift:0.3
form.OVAL       = excurrent:0 trunk_top:0.18 shell:3 irregularity:0.14 gaps:0.16 up:0.22 droop:0.02 leaf:ovate card:0.29 lift:0.35
form.SPREADING  = excurrent:0 trunk_top:0.06 shell:3.5 irregularity:0.20 gaps:0.18 up:0.02 droop:0.10 leaf:ovate card:0.26 lift:0.25
form.VASE       = excurrent:0 trunk_top:0.02 shell:3 irregularity:0.15 gaps:0.16 up:0.35 droop:0.02 leaf:small card:0.26 lift:0.4
form.WEEPING    = excurrent:0 trunk_top:0.35 shell:4 irregularity:0.14 gaps:0.08 up:0.0 droop:0.85 leaf:lance card:0.31 lift:-0.5
form.COLUMNAR   = excurrent:1 shell:2.5 irregularity:0.07 gaps:0.03 up:0.5 droop:0 leaf:scale card:0.56 lift:0.55 along:1 density:1.2
form.CONICAL    = excurrent:1 shell:1.6 irregularity:0.08 gaps:0.05 up:0.0 droop:0.18 leaf:spray card:0.38 lift:0.05 along:1 density:1.7
form.PYRAMIDAL  = excurrent:1 shell:2.5 irregularity:0.12 gaps:0.08 up:0.08 droop:0.06 leaf:ovate card:0.31 lift:0.25
form.PINE       = excurrent:1 shell:2 irregularity:0.24 gaps:0.16 clumps:9 up:0.10 droop:0.05 leaf:tuft card:0.38 lift:0.3 bark:bark_plated
form.MOUND      = excurrent:0 trunk_top:0 shell:3 irregularity:0.12 gaps:0.05 up:0.2 droop:0.05 leaf:small card:0.31 lift:0.45 density:0.8
form.SNAG       = excurrent:1 shell:1.5 irregularity:0.25 gaps:0.3 up:0.1 droop:0.1 leaf:ovate card:0.25 density:0.35

